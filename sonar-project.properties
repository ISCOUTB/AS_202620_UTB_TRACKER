sonar.projectKey=ISCOUTB_AS_202620_UTB_TRACKER
sonar.organization=isco-utb

sonar.projectName=UTB Tracker
sonar.projectVersion=0.8.0

# Rutas a analizar (excluye venv y cache de pytest)
sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/venv/**,**/__pycache__/**,**/*.pyc,**/migrations/**

# Cobertura de pruebas (generada por pytest-cov en CI)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
