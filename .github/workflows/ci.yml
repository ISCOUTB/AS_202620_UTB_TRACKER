name: UTB Tracker CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Servicio de PostgreSQL para las pruebas de integración (S8 — req. 8.2)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: "pip install --only-binary :all: -r requirements.txt"

      # Suite completa de pruebas (S8 — req. 8.2: corregido de app/tests/ a tests/)
      - name: Ejecutar pruebas (Pytest — suite completa)
        run: python -m pytest tests/ -v --tb=short

      - name: Análisis estático SonarCloud
        uses: SonarSource/sonarcloud-github-action@4b4d7634dab97dcee0b75763a54a6dc92a9e6bc1 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.USER_PASW }}
          script: |
            set -e
            cd ${{ secrets.WORK_DIR }}
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            sudo systemctl restart utb-tracker