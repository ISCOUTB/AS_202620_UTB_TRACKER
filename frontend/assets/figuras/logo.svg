<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="UTB Tracker">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47418F"/>
      <stop offset="1" stop-color="#332D83"/>
    </linearGradient>
  </defs>
  <!-- Icono de aplicación: cuadrado redondeado índigo UTB -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#fondo)"/>
  <!-- Plano de cuatro salones: tres ocupados (tenues) y uno libre (verde UTB) -->
  <rect x="24" y="24" width="34" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.28"/>
  <rect x="62" y="24" width="34" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.28"/>
  <rect x="24" y="62" width="34" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.28"/>
  <rect x="62" y="62" width="34" height="34" rx="9" fill="#187943"/>
  <rect x="62" y="62" width="34" height="34" rx="9" fill="none" stroke="#4CC38A" stroke-width="2.5"/>
  <!-- Visto: salón confirmado -->
  <path d="M70 80.5 l6.5 6.5 l12 -13.5" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
