<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="UTB Tracker">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3FE0"/>
      <stop offset="1" stop-color="#4B3BDB"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fondo: degradado azul → índigo de la app, con brillo difuminado arriba a la izquierda -->
  <rect x="2" y="2" width="116" height="116" rx="32" fill="url(#fondo)"/>
  <rect x="2" y="2" width="116" height="116" rx="32" fill="url(#brillo)"/>
  <!-- Pin de ubicación ("tracker") con el plano de cuatro salones dentro -->
  <path d="M60 104 C48 90 28 74 28 52 A32 32 0 1 1 92 52 C92 74 72 90 60 104 Z" fill="#FFFFFF"/>
  <rect x="42" y="34" width="16" height="16" rx="4.5" fill="#2F55E4" fill-opacity="0.35"/>
  <rect x="62" y="34" width="16" height="16" rx="4.5" fill="#2F55E4" fill-opacity="0.35"/>
  <rect x="42" y="54" width="16" height="16" rx="4.5" fill="#2F55E4" fill-opacity="0.35"/>
  <!-- Salón libre/confirmado -->
  <rect x="62" y="54" width="16" height="16" rx="4.5" fill="#2F55E4"/>
  <path d="M65.5 62 l3.2 3.2 l6 -6.6" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
